name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install -r requirements.txt

      - name: Run common tests
        run: python -m unittest discover apps/common/tests

      - name: Run database tests
        run: python -m unittest discover apps/database/tests

      - name: Run hashing tests
        run: python -m unittest discover apps/hashing/tests

      - name: Run modeling tests
        run: python -m unittest discover apps/modeling/tests
