name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: ${{ matrix.app }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - common
          - database
          - hashing
          - modeling

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install -r requirements.txt

      - name: Run ${{ matrix.app }} tests
        run: python -m unittest discover apps/${{ matrix.app }}/tests
